[project]
name = "uxr-job-radar"
version = "0.1.0"
description = "Evidence-based UXR job monitoring with local language models"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.12,<3", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
inference = ["mlx-lm==0.31.3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
uxr-radar = "uxr_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uxr_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
